code: GENERIC
name: Generic PII (jurisdiction-independent)
# Always-on pack for the most common, regex-reliable PII so the default config never
# leaks email/phone/card/IP even with Presidio disabled. PERSON/ORG/LOCATION remain the
# job of the Presidio/LLM-NER passes.
entity_types:
  - EMAIL
  - PHONE
  - CREDIT_CARD
  - IP_ADDRESS
  - IP_ADDRESS_V6
  - IBAN
  - DATE_OF_BIRTH
  - INSURANCE_POLICY
patterns:
  - type: EMAIL
    regex: '\b[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}\b'
    description: 'Email address'
  - type: CREDIT_CARD
    # 13–19 digits with optional single space/hyphen separators, Luhn-validated so random
    # long digit runs are not flagged. Catches Visa/MC/Amex/Discover formats.
    regex: '\b\d(?:[ \-]?\d){12,18}\b'
    validator: luhn
    description: 'Payment card number (Luhn-validated)'
  - type: PHONE
    # Require separators / parentheses / country code so bare 10-digit identifiers are not
    # swept up. Covers NA "(613) 555-0142", "+1 613-555-0142", "613.555.0142".
    regex: '(?:\+?\d{1,3}[ .\-]?)?(?:\(\d{3}\)|\d{3})[ .\-]\d{3}[ .\-]\d{4}\b'
    description: 'Phone number (NA / international with separators)'
  - type: IP_ADDRESS
    regex: '\b(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)\b'
    description: 'IPv4 address'
  - type: IP_ADDRESS_V6
    # Full and compressed IPv6 (RFC 5952). Catches 8-group full form and :: compressed.
    # Double-colon forms: ::1, fe80::1, 2001:db8::1, etc.
    regex: '(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}|(?:[0-9a-fA-F]{1,4}:){1,7}:|(?:[0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|::(?:[0-9a-fA-F]{1,4}:){0,5}[0-9a-fA-F]{1,4}|::1'
    description: 'IPv6 address'
  - type: IBAN
    # International Bank Account Number: 2-letter country + 2 check digits + up to 30
    # alphanumeric BBAN. Optionally space-grouped every 4 chars (print format).
    # Covers most common jurisdictions; does not re-validate checksum (low false-positive
    # risk because the 2-letter ISO prefix anchors the pattern).
    regex: '\b[A-Z]{2}\d{2}[ ]?(?:[A-Z0-9]{4}[ ]?){1,7}[A-Z0-9]{1,4}\b'
    description: 'IBAN (International Bank Account Number)'
  - type: DATE_OF_BIRTH
    # Date of birth, only when a birth cue precedes it ("born", "DOB", "birth(date|day)",
    # "date of birth", "date de naissance", "né(e) le", "дата народження/рождения", "ДН").
    # Without the cue the false-positive rate on ordinary dates (filing dates, tax years) is
    # too high, which is also why Presidio's DATE_TIME is not mapped (presidio_ner.py).
    # Formats: YYYY-MM-DD, DD/MM/YYYY or MM/DD/YYYY, DD.MM.YYYY (1-2 digit day/month), and
    # dates in words in English and French: "March 3, 1980", "Mar. 3 1980", "3 March 1980",
    # "3rd of March, 1980", "3 mars 1980", "1er août 1979". Case-insensitive; only the date
    # itself is redacted (named group `value`), so the cue stays readable for the model.
    # (Codex review on PR #1: word-form dates leaked once Presidio's DATE_TIME was dropped.)
    regex: '(?:born|dob|birth(?:date|day)?|date of birth|date de naissance|\bn[ée]e?\s+le|дата?\s+(?:народження|рождения)|ДН)(?:\s*(?:on|is|was|the|le|[:\-]))*\s*(?P<value>\d{4}[-/]\d{1,2}[-/]\d{1,2}|\d{1,2}[-/.]\d{1,2}[-/.]\d{4}|(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sept?(?:ember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?|janv(?:ier)?|f[ée]vr?(?:ier)?|mars|avr(?:il)?|mai|juin|juil(?:let)?|ao[uû]t|sept(?:embre)?|oct(?:obre)?|nov(?:embre)?|d[ée]c(?:embre)?)\b\.?\s+\d{1,2}(?:st|nd|rd|th)?,?\s+\d{4}|\d{1,2}(?:st|nd|rd|th|er|re)?\s+(?:of\s+)?(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sept?(?:ember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?|janv(?:ier)?|f[ée]vr?(?:ier)?|mars|avr(?:il)?|mai|juin|juil(?:let)?|ao[uû]t|sept(?:embre)?|oct(?:obre)?|nov(?:embre)?|d[ée]c(?:embre)?)\b\.?,?\s+\d{4})'
    flags: IGNORECASE
    description: 'Date of birth (cue-anchored, numeric or in words)'
  - type: INSURANCE_POLICY
    # Insurance / policy / claim reference after an explicit cue. Letters, digits, dashes.
    regex: '(?:policy|claim)\s*(?:number|no\.?|#)?[\s:#]*(?P<value>(?=[A-Z0-9-]*\d)[A-Z0-9][A-Z0-9-]{4,24}[A-Z0-9])\b'
    flags: IGNORECASE
    description: 'Insurance policy or claim number after a policy/claim cue'
