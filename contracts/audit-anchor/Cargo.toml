[package]
name = "redactgate-audit-anchor"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "NEAR contract that notarizes RedactGate audit-chain heads (append-only, no raw data)."
publish = false
rust-version = "1.86"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
